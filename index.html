<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JOOARIS — Journal</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <a href="/" class="brand">
        <img src="assets/logo.svg" alt="JOOARIS" class="logo">
        <span class="brand-name">JOOARIS</span>
      </a>
      <nav class="nav">
        <a href="https://jooaris.com">Home</a>
        <a href="https://jooaris.com/collection">Collection</a>
        <a href="https://jooaris.com/shop">Shop</a>
        <a href="#" class="active">Journal</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-title">JOOARIS — Journal</h1>
      <p class="hero-subtitle">Insights • Minimalism • Luxury • Technology</p>
    </div>
  </section>

  <!-- BLOG FEED -->
  <main class="container">
    <section class="blog-feed">
      <h2 class="section-title">Latest Articles</h2>
      <div id="blog-posts" class="posts-grid"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© <span id="year"></span> JOOARIS. All Rights Reserved.</p>
  </footer>

  <script src="blogfeed.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
